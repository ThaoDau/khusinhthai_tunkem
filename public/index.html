<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#29150e"><title>Khu sinh thái Địa Ngục — Làng 3D</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/game.css"><link rel="stylesheet" href="/performance.css"><link rel="stylesheet" href="/mystery.css"><link rel="stylesheet" href="/werewolf.css"><link rel="stylesheet" href="/land.css"><link rel="stylesheet" href="/handbook.css"></head><body>
<canvas id="world" aria-label="Thế giới 3D Địa Ngục. WASD để di chuyển, kéo chuột để xoay, cuộn để phóng to."></canvas><div id="loading"><div>✺</div><h1>ĐỊA NGỤC</h1><p>Đang mở cửa làng…</p></div>
<div class="game-hud"><button id="account" class="profile glass">Tạo nhân vật ↗</button><div class="location glass"><small>KHU SINH THÁI ĐỊA NGỤC</small><h1 id="area-title">Khu sinh thái Địa Ngục</h1><span id="area-sub">Cùng xây làng, làm nhiệm vụ và gặp gỡ bạn bè</span></div><div class="top-controls"><span class="live glass"><i></i><span id="online">Đang kết nối</span></span><button class="sound hud-circle" aria-label="Bật âm thanh">♫</button><button id="fullscreen" class="hud-circle" aria-label="Toàn màn hình">⛶</button><button id="guide" class="hud-circle" aria-label="Sổ tay hướng dẫn" title="Sổ tay hướng dẫn">📖</button></div>
<div class="left-tools"><button id="village-exit" class="glass small-btn">← Ra làng</button><button id="quest-toggle" class="glass small-btn">✦ Nhiệm vụ <span id="quest-total">0/7</span></button><button id="team-open" class="glass small-btn">⚑ Đội của tôi</button><button id="map-toggle" class="glass small-btn">⌘ Bản đồ</button></div>
<section id="quest-panel" class="glass floating-panel" hidden><div class="panel-title">VIỆC TỐT HÔM NAY <button id="quest-close" aria-label="Đóng nhiệm vụ">×</button></div><div id="quest-list" class="quest-grid"></div></section><div id="map-panel" class="glass map-panel" hidden></div><section id="area-guide" class="glass floating-panel area-guide" hidden><button id="area-guide-toggle" class="area-guide-head" aria-expanded="true"><span id="area-guide-title">Nơi này để làm gì?</span><i aria-hidden="true">⌄</i></button><div id="area-guide-body" class="area-guide-body"></div></section>
<div class="action-rail"><button id="primary-action" class="rail-action"><span>🌳</span>Khám phá làng</button><button id="bell" class="rail-action" title="Thỉnh chuông"><span>🔔</span>Thỉnh chuông</button><button id="people-toggle" class="rail-action"><span>👥</span>Bạn bè <b id="player-count">0</b></button></div><section id="people-panel" class="glass floating-panel people-panel" hidden><div class="panel-title">BẠN BÈ TRONG LÀNG</div><div id="players"></div><button id="team-arrow" class="text-btn">⚑ Tìm đồng đội →</button></section>
<section class="community glass" id="chat-panel"><button id="chat-toggle" class="chat-title">◌ Chuyện trong làng <span>⌄</span></button><div class="chat-content"><div class="chat-tabs"><button data-channel="global" class="active">Cả làng</button><button data-channel="team">Đội nhóm</button><button data-channel="private">Tin riêng</button></div><div id="recipient-wrap" hidden><select id="recipient" aria-label="Người nhận tin riêng"><option value="">Chọn người bạn…</option></select></div><div id="messages" class="messages"></div><form id="chat-form" class="chat-input"><input id="message" maxlength="300" autocomplete="off" placeholder="Nhấn vào đây để trò chuyện…" aria-label="Tin nhắn"><button aria-label="Gửi tin nhắn">➤</button></form></div></section>
<div class="bottom-center"><div id="interaction" class="glass interaction" hidden><i id="interaction-bar"></i><kbd>E</kbd><span>Vào chánh điện</span><button id="interact-button">Đi vào →</button></div><div class="controls-hint"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Di chuyển</span><span>Kéo chuột · Xoay góc nhìn</span><span>Cuộn · Phóng to</span></div></div>
<div class="mini-map glass"><canvas id="minimap" width="190" height="150" aria-label="Bản đồ vị trí trong làng"></canvas><span id="mini-label">CHÁNH ĐIỆN</span><div class="zoom"><button id="zoom-in" aria-label="Phóng to">+</button><button id="zoom-out" aria-label="Thu nhỏ">−</button></div></div><div class="mobile-controls"><button data-key="w" aria-label="Đi tới">▲</button><div><button data-key="a" aria-label="Sang trái">◀</button><button data-key="s" aria-label="Đi lùi">▼</button><button data-key="d" aria-label="Sang phải">▶</button></div></div><span id="connection" class="connection">Đang kết nối…</span></div>
<div hidden><nav id="places"></nav><span id="crumb"></span><span id="scene-caption"></span><span id="scene-count"></span><span id="action-icon"></span><span id="action-title"></span><span id="action-sub"></span></div><dialog id="modal"><button id="close-modal" class="close" aria-label="Đóng">×</button><div id="modal-content"></div></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
